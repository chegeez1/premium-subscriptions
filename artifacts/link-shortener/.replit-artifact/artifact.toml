kind = "web"
previewPath = "/"
title = "Link Shortener"
version = "1.0.0"
id = "artifacts/link-shortener"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22508

[services.development]
run = "pnpm --filter @workspace/link-shortener run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/link-shortener", "run", "build" ]
publicDir = "artifacts/link-shortener/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22508"
BASE_PATH = "/"
