openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: links
    description: Link shortener operations
  - name: tools
    description: Free tool operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /links:
    get:
      operationId: listLinks
      tags: [links]
      summary: List all shortened links
      responses:
        "200":
          description: List of links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Link"
    post:
      operationId: createLink
      tags: [links]
      summary: Create a shortened link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkBody"
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /links/stats:
    get:
      operationId: getLinkStats
      tags: [links]
      summary: Get global stats
      responses:
        "200":
          description: Global stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkStats"

  /links/{id}:
    get:
      operationId: getLinkById
      tags: [links]
      summary: Get a link by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Link found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLink
      tags: [links]
      summary: Delete a link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tools/bin/{bin}:
    get:
      operationId: checkBin
      tags: [tools]
      summary: Look up BIN/IIN details
      parameters:
        - name: bin
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: BIN info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BinResult"
        "400":
          description: Invalid BIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: BIN not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tools/cc/check:
    post:
      operationId: checkCard
      tags: [tools]
      summary: Check if a card is live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardCheckBody"
      responses:
        "200":
          description: Card check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardCheckResult"
        "400":
          description: Invalid card format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tools/cc/generate:
    post:
      operationId: generateCards
      tags: [tools]
      summary: Generate test card numbers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCardsBody"
      responses:
        "200":
          description: Generated cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedCard"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Link:
      type: object
      properties:
        id:
          type: integer
        originalUrl:
          type: string
        slug:
          type: string
        clicks:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - originalUrl
        - slug
        - clicks
        - createdAt

    CreateLinkBody:
      type: object
      properties:
        originalUrl:
          type: string
        customSlug:
          type: string
      required:
        - originalUrl

    LinkStats:
      type: object
      properties:
        totalLinks:
          type: integer
        totalClicks:
          type: integer
        topLinks:
          type: array
          items:
            $ref: "#/components/schemas/Link"
      required:
        - totalLinks
        - totalClicks
        - topLinks

    DeleteResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    BinResult:
      type: object
      properties:
        bin:
          type: string
        scheme:
          type: string
        type:
          type: string
        brand:
          type: string
        bank:
          type: string
        country:
          type: string
        countryCode:
          type: string
        emoji:
          type: string
      required:
        - bin
        - scheme
        - type

    CardCheckBody:
      type: object
      properties:
        number:
          type: string
        month:
          type: string
        year:
          type: string
        cvv:
          type: string
      required:
        - number
        - month
        - year
        - cvv

    CardCheckResult:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        card:
          type: string
        bank:
          type: string
        type:
          type: string
        category:
          type: string
        country:
          type: string
        emoji:
          type: string
      required:
        - status
        - message

    GenerateCardsBody:
      type: object
      properties:
        bin:
          type: string
          description: BIN prefix to use (optional, defaults to random Visa)
        count:
          type: integer
          description: Number of cards to generate (1-20)
        month:
          type: string
        year:
          type: string
        cvv:
          type: string
      required: []

    GeneratedCard:
      type: object
      properties:
        number:
          type: string
        month:
          type: string
        year:
          type: string
        cvv:
          type: string
        formatted:
          type: string
      required:
        - number
        - month
        - year
        - cvv
        - formatted
